<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuste de Volume</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Ajuste de volume</h1><br><br>
    <form id="volumeForm">
        <label for="placa">Placa:</label>
        <input type="text" id="placa" pattern="([A-Za-z]{3}[0-9]{4})|([A-Za-z]{3}[0-9][A-Za-z][0-9]{2})" placeholder="Placa: ABC1234 ou ABC1D23"><br><br>
        <label for="volume">Volume:</label>
        <input type="number" id="volume" min="0" max="100" placeholder="Volume: 0-100"><br><br>
        <label for="csv">Arquivo CSV:</label>
        <input type="file" id="csv" accept=".csv" multiple>
        <button type="button" class="clear-button" onclick="clearCSV()">×</button><br><br>
        <button type="submit">Ajustar Volume</button>
    </form>
    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
